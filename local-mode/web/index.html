<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Pit Local (Sin Internet)</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root { --bg:#0b0f14; --card:#131a22; --accent:#3ddc97; --text:#e8f0f2; --muted:#7a8a94; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  #login { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:16px; padding:24px; }
  #login input { padding:14px; border-radius:12px; border:1px solid #22303a; background:var(--card); color:var(--text); font-size:16px; width:100%; max-width:320px; }
  #login button, #composer button { background:var(--accent); color:#04140d; border:none; border-radius:12px; padding:14px 20px; font-weight:700; font-size:16px; cursor:pointer; }
  h1 { color:var(--accent); font-size:28px; }
  #chat { display:none; flex-direction:column; height:100%; }
  #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; background:var(--card); align-self:flex-start; }
  .msg.mine { background:var(--accent); color:#04140d; align-self:flex-end; }
  .msg .sender { font-size:11px; opacity:0.6; display:block; margin-bottom:2px; }
  #composer { display:flex; gap:8px; padding:12px; background:var(--card); }
  #composer input { flex:1; padding:14px; border-radius:12px; border:none; background:#0f151b; color:var(--text); font-size:16px; }
  #status { font-size:12px; color:var(--muted); text-align:center; padding:6px; }
</style>
</head>
<body>
  <div id="login">
    <h1>Pit Local ⚡</h1>
    <p style="color:var(--muted); text-align:center; max-width:320px;">
      Chat en tiempo real sin internet — solo necesitás estar en la misma WiFi o hotspot.
    </p>
    <input id="nameInput" placeholder="Tu nombre" autofocus />
    <button onclick="join()">Entrar</button>
  </div>

  <div id="chat">
    <div id="status">Conectado en red local</div>
    <div id="messages"></div>
    <div id="composer">
      <input id="msgInput" placeholder="Escribí un mensaje..." onkeydown="if(event.key==='Enter') send()" />
      <button onclick="send()">Enviar</button>
    </div>
  </div>

<script>
  const socket = io();
  let myName = '';

  async function loadHistory() {
    const res = await fetch('/history');
    const rows = await res.json();
    rows.forEach(renderMessage);
  }

  function join() {
    myName = document.getElementById('nameInput').value.trim();
    if (!myName) return;
    socket.emit('join', myName);
    document.getElementById('login').style.display = 'none';
    document.getElementById('chat').style.display = 'flex';
    loadHistory();
  }

  function send() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content) return;
    socket.emit('message', content);
    input.value = '';
  }

  function renderMessage(msg) {
    const div = document.createElement('div');
    div.className = 'msg' + (msg.sender === myName ? ' mine' : '');
    div.innerHTML = `<span class="sender">${msg.sender}</span>${msg.content}`;
    document.getElementById('messages').appendChild(div);
    div.scrollIntoView();
  }

  socket.on('message', renderMessage);
  socket.on('presence', (p) => {
    const div = document.createElement('div');
    div.style.textAlign = 'center';
    div.style.fontSize = '12px';
    div.style.color = 'var(--muted)';
    div.textContent = `${p.name} ${p.online ? 'se conectó' : 'se desconectó'}`;
    document.getElementById('messages').appendChild(div);
    div.scrollIntoView();
  });
</script>
</body>
</html>
